<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Courier Pilot</title>
  <style>
    body { font-family: sans-serif; margin: 40px; background: #f9f9f9; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { font-size: 24px; text-align: center; }
    .step { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="text"], textarea, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
    button:hover { background: #0056b3; }
    .status { margin-top: 20px; padding: 10px; border-radius: 4px; background: #e9ecef; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Courier Pilot</h1>
    
    <div id="setup-view">
      <div class="step">
        <label for="goal-text">1. What do you want to do?</label>
        <textarea id="goal-text" rows="3" placeholder="e.g. Test the physics engine collision..."></textarea>
      </div>

      <div class="step">
        <label for="ai-provider">2. Your AI Provider</label>
        <select id="ai-provider">
          <option value="mac">Local Mac Worker</option>
          <option value="windows">Windows Worker</option>
        </select>
      </div>

      <div class="step">
        <label for="api-key">3. Connection API Key</label>
        <input type="text" id="api-key" placeholder="Courier API Key" />
      </div>

      <div class="step" style="background: #fff3cd; padding: 10px; border-radius: 4px; border: 1px solid #ffeeba;">
        <p id="cost-note-label"><strong>4. Approximate Cost / Risk</strong></p>
        <p style="margin: 0; font-size: 14px;">Estimated cost: <strong>$0.15</strong>. Courier requires read/write access to your work directory. Cryptographic proofs will be saved.</p>
      </div>

      <p id="setup-error" role="alert" hidden></p>
      <button id="start-btn">Start Courier</button>
    </div>

    <div id="progress-view" class="hidden">
      <h2>Status</h2>
      <div id="status-box" class="status">Connecting...</div>
      
      <div style="margin-top: 20px;">
        <h2 id="task-list-label">5. What result Courier is producing:</h2>
        <ul id="task-list" aria-labelledby="task-list-label"></ul>
      </div>

      <div style="margin-top: 20px;">
        <h2 id="completion-label">6. When is Courier done?</h2>
        <div id="completion-box" aria-labelledby="completion-label" style="font-weight: bold; color: #28a745;">Running...</div>
      </div>
    </div>
  </div>

  <script src="pilot_form.js"></script>
  <script>
    document.getElementById('start-btn').addEventListener('click', async () => {
      const goalText = document.getElementById('goal-text').value;
      const apiKey = document.getElementById('api-key').value;
      const provider = document.getElementById('ai-provider').value;
      const error = document.getElementById('setup-error');
      const missing = missingPilotFields(goalText, apiKey);
      for (const id of ['goal-text', 'api-key']) {
        document.getElementById(id).removeAttribute('aria-invalid');
      }
      if (missing.length) {
        error.hidden = false;
        error.textContent = pilotFieldError(missing);
        for (const field of missing) {
          const el = document.getElementById(field.id);
          el.setAttribute('aria-invalid', 'true');
          el.setAttribute('aria-describedby', 'setup-error');
        }
        document.getElementById(missing[0].id).focus();
        return;
      }
      error.hidden = true;
      error.textContent = '';

      document.getElementById('setup-view').classList.add('hidden');
      document.getElementById('progress-view').classList.remove('hidden');

      try {
        const response = await fetch('/goals', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({ 
            goal_text: goalText, budget: 2.0,
            workflow_plan: [
              { target_agent: provider, instruction: goalText }
            ]
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error);

        document.getElementById('status-box').innerText = `Goal created: ${data.goal_id}`;
        pollGoal(data.goal_id, apiKey);

      } catch (err) {
        document.getElementById('status-box').innerText = `Error: ${err.message}`;
        document.getElementById('status-box').style.background = '#f8d7da';
      }
    });

    async function pollGoal(goalId, apiKey) {
      const interval = setInterval(async () => {
        try {
          const res = await fetch(`/goals/${goalId}`, {
            headers: { 'Authorization': `Bearer ${apiKey}` }
          });
          const data = await res.json();

          const taskList = document.getElementById('task-list');
          taskList.innerHTML = '';
          
          if (data.workflow_plan) {
            data.workflow_plan.forEach(task => {
              const li = document.createElement('li');
              li.innerText = `Task [${task.target_agent}]: ${task.status}`;
              taskList.appendChild(li);
            });
          }

          if (data.status === 'SUCCESS' || data.status === 'DONE') {
            clearInterval(interval);
            document.getElementById('status-box').innerText = "Workflow Completed Successfully!";
            document.getElementById('status-box').style.background = '#d4edda';
            document.getElementById('completion-box').innerText = "Courier is DONE.";
          } else if (data.status === 'FAILED') {
            clearInterval(interval);
            document.getElementById('status-box').innerText = "Workflow Failed.";
            document.getElementById('status-box').style.background = '#f8d7da';
            document.getElementById('completion-box').innerText = "Courier stopped due to failure.";
          }

        } catch (e) {
          console.error(e);
        }
      }, 1000);
    }
  </script>
</body>
</html>
