    plus 0f1d4539 (NEXT-WORK G5 PACKETS_COMPLETE) via ff-only, worktree
    draft preserved; reviewed all 3 tests read-only (2 AST-static,
    1 tmp-isolated functional); ran them - 3 passed; foreign still
    ACTIVE - rest-draft untouched
  last_test: owner G5 batch - motor_swallow plus server_retry plus
    ledger_overwrite (3 passed, 0.46s, this turn)
  last_test_result: GREEN - draft motor calls update_ledger in handler;
    committed server transitions FAILED_TERMINAL without zero-reset;
    draft update_ledger preserves BLOCKED
