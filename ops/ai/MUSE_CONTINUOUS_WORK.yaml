version: 1
name: MUSE_CONTINUOUS_WORK_LOOP
mode: CONTINUOUS_FIXED_POINT
purpose: >
  Durable, file-driven work loop for MUSE so the user does not need to provide
  repeated prompts. MUSE updates this file as a checkpoint, always selects the
  next safe lane, and only returns when the global stop condition is true.

canonical_inputs:
  - ops/ai/START_HERE.md
  - ops/ai/MASTER_OPERATING_SYSTEM.md
  - ops/ai/OWNERSHIP_MAP.yaml
  - ops/ai/NEXT_WORK.yaml
  - ops/ai/DEFERRED_LEDGER_QUEUE.yaml
  - ops/ai/TEST_MAP.yaml
  - ops/ai/FAILURE_SIGNATURES.yaml
  - ops/ai/packets/

truth_rules:
  current_reality_wins: true
  ledger_last: true
  no_fake_green: true
  one_writer_per_sensitive_scope: true
  preserve_foreign_work: true
  no_reset_hard: true
  no_blind_git_clean: true
  no_force_push: true
  no_generic_killall: true
  no_unauthorized_external_effects: true
  no_synthetic_physical_proof: true

ownership:
  ledger_guard_motor_production_owner: GOOGLE
  muse_default_mode: PACKET_QA_ADVERSARIAL_TESTS_AND_SAFE_NONCONFLICTING_WORK
  production_edit_rule: >
    MUSE must not edit GOOGLE-owned Ledger/Guard/Motor production files unless
    OWNERSHIP_MAP.yaml explicitly hands that scope to MUSE at the current HEAD.
  blocked_scope_rule: >
    A blocked or foreign-owned file blocks one task, not the whole loop.
    Immediately switch to another safe lane.

scheduler:
  selection_order:
    - LEDGER_PACKET_FORGE
    - LEDGER_ADVERSARIAL_TEST_FACTORY
    - MOTOR_QUEUE_TORTURE
    - WINDOWS_PHYSICAL_PREP
    - CODEX_FEED
    - SHARED_MEMORY_MAINTENANCE
  on_success: RECOMPUTE_FRONTIER_AND_CONTINUE
  on_test_failure: DIAGNOSE_REPAIR_OR_PACKETIZE_THEN_CONTINUE
  on_test_pass: CONTINUE
  on_commit: CONTINUE
  on_push: CONTINUE
  on_blocker: PARK_BLOCKER_AND_SELECT_NEXT_SAFE_LANE
  on_foreign_ownership: SELECT_NEXT_SAFE_LANE
  on_provider_wait: SELECT_NEXT_SAFE_LANE
  on_missing_physical_access: FINISH_SOFTWARE_PREP_THEN_SELECT_NEXT_SAFE_LANE
  on_human_gate: GATE_ONLY_EXACT_ACTION_AND_SELECT_NEXT_SAFE_LANE

checkpoint:
