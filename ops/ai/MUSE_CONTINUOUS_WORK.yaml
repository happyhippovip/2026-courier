  - id: CODEX_FEED
    priority: P1
    allowed_writes:
      - ops/ai/packets/**
      - ops/ai/MUSE_CONTINUOUS_WORK.yaml
    mission: >
      Maintain N/N+1/N+2 complete high-risk review packets so Codex never needs
      broad archaeology and does not return PACKET_INCOMPLETE for ready work.
    required_fields:
      - CURRENT_HEAD
      - COMMITS_UNDER_REVIEW
      - INVARIANTS
      - DIFF_SCOPE
      - REPRODUCERS
      - T2_RESULTS
      - T3_RESULTS
      - KNOWN_ATTACKS
      - FILES_TO_READ
      - QUESTIONS_TO_ANSWER
    completion: >
      Every current high-risk batch is either CODEX_READY, waiting on implementation,
      or truthfully PHYSICAL_PENDING.

  - id: SHARED_MEMORY_MAINTENANCE
    priority: P2
    allowed_writes:
      - ops/ai/**
    forbidden_without_explicit_ownership:
      - scripts/agent_handoff_ledger.py
      - scripts/courier_continue.py
      - server/app.py
    mission: >
      Remove stale bindings, duplicate facts, obsolete packets and resolved queue
      entries only when current executable evidence proves the update. Preserve a
      single canonical shared memory and record only durable verified knowledge.
    completion: >
      Shared memory matches current committed reality and contains no known
      contradiction affecting task routing.

work_unit_protocol:
  - VERIFY_CURRENT_HEAD_AND_REMOTE
  - READ_ONLY_MINIMUM_RELEVANT_ARTIFACTS
  - SELECT_HIGHEST_PRIORITY_SAFE_WORK
  - REPRODUCE_OR_VALIDATE
  - EXECUTE_SAFE_WORK
  - T0
  - T1
  - T2_IF_AFFECTED
  - SELF_ATTACK
  - UPDATE_PACKET_OR_ARTIFACT
  - COMMIT_ONLY_COHERENT_OWNED_CHANGES_WHEN_SAFE
  - PUSH_WHEN_SAFE_AND_AUTHORIZED
  - UPDATE_THIS_CHECKPOINT
  - RECOMPUTE_FRONTIER
  - REPEAT

return_policy:
  progress_reports_forbidden: true
  ask_proceed_forbidden: true
  ask_what_next_forbidden: true
  return_after_one_task_forbidden: true
  return_after_test_pass_forbidden: true
  return_after_test_failure_forbidden: true
  return_after_commit_forbidden: true
  stop_allowed_only_if:
    - >
      Every safe lane above is exhausted at current HEAD AND every remaining item
      is one of HUMAN_AUTHORITY_REQUIRED, WINDOWS_PHYSICAL_REQUIRED,
      FOREIGN_ACTIVE_OWNERSHIP, or EXTERNAL_IRREVERSIBLE_GATE.
    - >
      There is no independent safe preparation, testing, packetization,
      adversarial work, shared-memory repair, or Codex-feed work remaining.
  final_return_must_include:
    - CURRENT_HEAD
    - REMOTE_HEAD
    - ITERATIONS_COMPLETED
    - LANES_EXHAUSTED
    - PACKETS_READY
    - BLOCKERS_PARKED
    - TESTS_RUN
    - COMMITS_PUSHED
    - SAFE_WORK_REMAINING
    - WHY_GLOBAL_STOP_IS_TRUE

usage:
  one_time_prompt: >
    Read ops/ai/MUSE_CONTINUOUS_WORK.yaml and enter CONTINUOUS_FIXED_POINT mode.
    Treat the YAML as your durable scheduler and checkpoint. Update its checkpoint
    after each coherent work unit. Never return while any safe lane is executable.
    Do not restart discovery; resume from checkpoint and current HEAD.
  day2-close:
    at: 2026-09-19
    batch: MUSE-51..150
    executed_tests: "work-script/*.test.mjs 65/65 PASS (56 Bestand + 9 fake_worker neu); CLEAN_START=PASS live"
