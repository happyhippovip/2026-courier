      - ops/ai/FAILURE_SIGNATURES.yaml
      - ops/ai/SOURCE_MAP.md
      - ops/ai/TEST_MAP.yaml
      - ops/ai/MUSE_CONTINUOUS_WORK.yaml
    mission: >
      Make DLQ-01/02/03 and any newly verified Ledger/Guard findings
      implementation-ready for GOOGLE with exact files/functions, deterministic
      reproducers, invariants, negative tests, restart/replay/concurrency cases,
      dependencies and zero-archaeology handoff.
    completion: >
      All currently known Ledger/Guard packets are implementation-grade except
      fields explicitly waiting on Codex/Google/Windows evidence.

  - id: LEDGER_ADVERSARIAL_TEST_FACTORY
    priority: P0
    allowed_writes:
      - tests/**
      - ops/ai/packets/**
      - ops/ai/ATTACK_LOG.md
      - ops/ai/MUSE_CONTINUOUS_WORK.yaml
    mission: >
      Build durable attacks for self-certification, evidence laundering, stale
      evidence, wrong SHA/runtime/process, replay, identity-string forgery,
      duplicate semantics, false CLEAN_IDLE, false QUEUE_INDEPENDENT, and
      cross-defect crash boundaries. Do not weaken tests to make current code green.
    completion: >
      Every currently specified attack has a deterministic test/reproducer or a
      precise reason it requires later physical/authority evidence.

  - id: MOTOR_QUEUE_TORTURE
    priority: P1
    allowed_writes:
      - tests/**
      - ops/ai/packets/**
      - ops/ai/FAILURE_SIGNATURES.yaml
      - ops/ai/MUSE_CONTINUOUS_WORK.yaml
    mission: >
      Attack WAITING_PROVIDER isolation, queue starvation, done-edge frontier
      refresh, --once early exit, restart/resume, ACK loss, duplicate execution,
      stale lease, orphan process, missing timeout, deadlock, false idle, and
      zero-chat replenishment. Do not collide with active GOOGLE-owned production files.
    completion: >
      All safely testable Motor/queue attack families have deterministic evidence
      and repair packets or are explicitly physical/ownership blocked.

  - id: WINDOWS_PHYSICAL_PREP
    priority: P1
    allowed_writes:
      - ops/ai/packets/**
      - tests/**
      - ops/ai/WINDOWS_RUNTIME_MAP.md
      - ops/ai/MUSE_CONTINUOUS_WORK.yaml
    mission: >
      Prepare exact Windows execution packets for process->executable->worktree->SHA,
      OS-owned Motor persistence, restart/resume, WAITING_PROVIDER isolation,
      DLQ-06 transient file-sharing failures, duplicate prevention, and final
      physical acceptance. Mac preparation must never be labeled physical proof.
    completion: >
      Windows worker can execute every remaining physical scenario without repo
