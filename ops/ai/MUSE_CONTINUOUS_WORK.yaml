    audits_readonly: "100 auto-upshift PASS (keine Logik); 103 Logging PASS minimal; 143 app.py atomar PASS, daemon plain writes -> Google; 144 zwei Writer, shared-file offen; 52 sync READY/PASS false-green bestaetigt; 63 DONE-Bindung offen"
    demos_mapped: "109-118 auf fake_worker-Modi; 112,113,114,115,116,117,118,127 per Test belegt"
    false_pass_count_day2: 0
    status: MUSE_DAY2_STATUS=YELLOW
