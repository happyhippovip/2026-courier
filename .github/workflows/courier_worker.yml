name: Courier Worker
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task ID"
        required: true
        type: string
      instruction:
        description: "Instruction"
        required: true
        type: string
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Task $TASK_ID"
        env:
          TASK_ID: ${{ github.event.inputs.task_id }}
