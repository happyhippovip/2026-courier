name: Courier Worker
run-name: Courier dispatch ${{ fromJson(inputs.task_payload).dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      task_payload:
        description: Compact bounded Courier TaskPacket JSON
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: courier-dispatch-${{ fromJson(inputs.task_payload).dispatch_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            README.md
            scripts
            server
      - name: Execute allow-listed TaskPacket operation
        env:
          TASK_PAYLOAD: ${{ inputs.task_payload }}
        run: |
          cat > "$RUNNER_TEMP/courier_task.py" <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path, PurePosixPath

          task = json.loads(os.environ["TASK_PAYLOAD"])
          required = ("goal_id", "task_id", "attempt_id", "dispatch_id", "worker_id")
          if not all(isinstance(task.get(field), str) and task[field] for field in required):
              raise ValueError("TaskPacket is missing required identity fields")
          operation = task.get("task_type", task.get("type"))
          allowed = {"metadata", "report", "deterministic_transform", "verify_file", "static_analysis", "run_tests"}
          if operation not in allowed:
              raise ValueError(f"unsupported bounded task type: {operation!r}")

          dispatch_id = task["dispatch_id"]
          evidence_path = Path(f"courier_output_{dispatch_id}.json")
          def evidence(value):
              evidence_path.write_text(json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n")
              return {"path": evidence_path.name, "sha256": hashlib.sha256(evidence_path.read_bytes()).hexdigest()}

          if operation == "metadata":
              artifact = evidence({"operation": operation, "source_sha": os.environ["GITHUB_SHA"]})
          elif operation == "report":
              report = task.get("report")
              if not isinstance(report, (dict, list, str)):
                  raise ValueError("report requires JSON-compatible report content")
              artifact = evidence({"operation": operation, "report": report})
          elif operation == "deterministic_transform":
              value = task.get("input")
              if not isinstance(value, str):
                  raise ValueError("deterministic_transform requires a string input")
              artifact = evidence({"operation": operation, "input_sha256": hashlib.sha256(value.encode()).hexdigest()})
          elif operation == "verify_file":
              name = task.get("path")
              path = PurePosixPath(name) if isinstance(name, str) else None
              if not path or path.is_absolute() or ".." in path.parts or not Path(path).is_file():
                  raise ValueError("verify_file requires an existing safe repository-relative path")
              artifact = evidence({"operation": operation, "path": str(path), "sha256": hashlib.sha256(Path(path).read_bytes()).hexdigest()})
          else:
              command = [sys.executable, "-m", "pytest", "-q", "tests"] if operation == "run_tests" else [sys.executable, "-m", "compileall", "-q", "scripts", "server"]
              completed = subprocess.run(command, capture_output=True, text=True, check=False)
              if completed.returncode:
                  raise RuntimeError((completed.stdout + completed.stderr)[-4000:])
              artifact = evidence({"operation": operation, "command": command, "exit_code": 0})

          result = {
              **{field: task[field] for field in required},
              "provider": "github",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job_id": os.environ["GITHUB_JOB"],
              "result_id": f"result-{dispatch_id}",
              "source_sha": os.environ["GITHUB_SHA"],
              "status": "SUCCESS",
              "operation": operation,
              "artifacts": [artifact],
          }
          Path(f"result_{dispatch_id}.json").write_text(json.dumps(result, sort_keys=True) + "\n")
          PY
          set +e
          python3 "$RUNNER_TEMP/courier_task.py"
          status=$?
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          task = json.loads(os.environ["TASK_PAYLOAD"])
          fields = ("goal_id", "task_id", "attempt_id", "dispatch_id", "worker_id")
          if all(isinstance(task.get(field), str) and task[field] for field in fields):
              Path(f"result_{task['dispatch_id']}.json").write_text(json.dumps({
                  **{field: task[field] for field in fields}, "provider": "github",
                  "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "result_id": f"result-{task['dispatch_id']}", "status": "FAILED", "artifacts": [],
                  "reason": "BOUNDED_OPERATION_FAILED"}, sort_keys=True) + "\n")
          PY
          fi
          exit "$status"
      - name: Upload dispatch-bound DurableResult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courier-result-${{ fromJson(inputs.task_payload).dispatch_id }}
          path: |
            result_*.json
            courier_output_*.json
          if-no-files-found: error
