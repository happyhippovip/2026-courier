name: Courier Worker
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task ID"
        required: true
        type: string
      instruction:
        description: "Instruction"
        required: true
        type: string
      goal_id:
        description: "Goal ID"
        required: false
        type: string
      runner_label:
        description: "Target Runner OS/Label (windows, macos, ubuntu-latest)"
        required: true
        type: string
        default: "ubuntu-latest"
      mode:
        description: "Execution Mode (ANTIGRAVITY or NATIVE)"
        required: false
        type: string
        default: "ANTIGRAVITY"

jobs:
  execute:
    runs-on: ${{ github.event.inputs.runner_label }}
    steps:
      - name: Bridge Task to Native Daemon
        shell: bash
        run: |
          echo "Processing task: ${{ github.event.inputs.task_id }}"
          echo "Target Runner: ${{ github.event.inputs.runner_label }}"
          
          TASK_JSON=$(cat <<EOF
          {
            "task_id": "${{ github.event.inputs.task_id }}",
            "instruction": $(echo "${{ github.event.inputs.instruction }}" | jq -R -s '.'),
            "goal_id": "${{ github.event.inputs.goal_id }}",
            "mode": "${{ github.event.inputs.mode }}"
          }
          EOF
          )
          
          if [ "${{ runner.os }}" == "macOS" ]; then
             DAEMON_DIR="$HOME/courier/scripts/mac_worker"
             mkdir -p "$DAEMON_DIR/inbox" "$DAEMON_DIR/outbox"
             echo "$TASK_JSON" > "$DAEMON_DIR/inbox/${{ github.event.inputs.task_id }}.json"
             
             echo "Waiting for Mac daemon to finish task..."
             while [ ! -f "$DAEMON_DIR/outbox/${{ github.event.inputs.task_id }}_result.json" ]; do
                 sleep 2
             done
             cp "$DAEMON_DIR/outbox/${{ github.event.inputs.task_id }}_result.json" ./result.json
             
          elif [ "${{ runner.os }}" == "Windows" ]; then
             # Ensure path exists for Windows daemon
             DAEMON_DIR="C:/Users/lol/2026-workspace/courier/scripts/windows_worker"
             mkdir -p "$DAEMON_DIR/inbox" "$DAEMON_DIR/outbox"
             echo "$TASK_JSON" > "$DAEMON_DIR/inbox/${{ github.event.inputs.task_id }}.json"
             
             echo "Waiting for Windows daemon to finish task..."
             while [ ! -f "$DAEMON_DIR/outbox/${{ github.event.inputs.task_id }}_result.json" ]; do
                 sleep 2
             done
             cp "$DAEMON_DIR/outbox/${{ github.event.inputs.task_id }}_result.json" ./result.json
             
          else
             # Default Ubuntu Cloud Mode
             cat << 'PY_EOF' > run_task.py
          import os, sys, json
          task_id = os.environ.get("TASK_ID", "unknown")
          goal_id = os.environ.get("GOAL_ID", "")
          instruction = os.environ.get("INSTRUCTION", "echo 'No instruction'")
          print(f"Executing: {instruction}")
          with open("task_script.sh", "w") as f:
              f.write(instruction)
          os.chmod("task_script.sh", 0o755)
          exit_code = os.system("./task_script.sh")
          res = {
              "task_id": task_id,
              "goal_id": goal_id,
              "status": "SUCCESS" if exit_code == 0 else "FAILED",
              "provider": "github",
              "worker_id": "GITHUB-HOSTED",
              "exit_code": exit_code
          }
          with open("result.json", "w") as f:
              json.dump(res, f)
          PY_EOF
             python3 run_task.py
          fi
        env:
          TASK_ID: ${{ github.event.inputs.task_id }}
          GOAL_ID: ${{ github.event.inputs.goal_id }}
          INSTRUCTION: ${{ github.event.inputs.instruction }}
      
      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courier-result-${{ github.event.inputs.task_id }}
          path: |
            result.json
            courier_canary_*.txt
