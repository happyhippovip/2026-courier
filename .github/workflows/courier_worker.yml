name: Courier Worker

on:
  workflow_dispatch:
    inputs:
      task_payload:
        description: TaskPacket JSON
        required: true
        type: string
      runner:
        description: Optional approved self-hosted runner label
        required: false
        default: ubuntu-latest
        type: string

permissions:
  contents: read

jobs:
  execute:
    runs-on: ${{ inputs.runner == 'self-hosted' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Execute bounded TaskPacket operation
        env:
          TASK_PAYLOAD: ${{ inputs.task_payload }}
        run: |
          cat > "$RUNNER_TEMP/courier_task.py" <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path, PurePosixPath

          task = json.loads(os.environ["TASK_PAYLOAD"])
          required = ("goal_id", "task_id", "attempt_id", "dispatch_id", "worker_id")
          if not all(isinstance(task.get(field), str) and task[field] for field in required):
              raise ValueError("TaskPacket is missing required identity fields")

          task_type = task.get("task_type", task.get("type"))
          allowed = {
              "repo_inspect", "run_tests", "lint", "static_analysis", "package",
              "metadata", "report", "verify_file", "deterministic_transform",
          }
          if task_type not in allowed:
              raise ValueError(f"unsupported bounded task type: {task_type!r}")

          dispatch_id = task["dispatch_id"]
          output = Path(f"courier_output_{dispatch_id}.json")
          def write(value):
              output.write_text(json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n")
              return {"path": output.name, "sha256": hashlib.sha256(output.read_bytes()).hexdigest()}

          if task_type == "deterministic_transform":
              value = task.get("input")
              if not isinstance(value, str):
                  raise ValueError("deterministic_transform requires a string input")
              evidence = write({"operation": task_type, "sha256": hashlib.sha256(value.encode()).hexdigest()})
          elif task_type == "metadata":
              evidence = write({"operation": task_type, "repository": os.environ["GITHUB_REPOSITORY"],
                                "source_sha": os.environ["GITHUB_SHA"]})
          elif task_type == "report":
              report = task.get("report")
              if not isinstance(report, (dict, list, str)):
                  raise ValueError("report requires JSON-compatible report content")
              evidence = write({"operation": task_type, "report": report})
          elif task_type in {"repo_inspect", "verify_file"}:
              filename = task.get("path")
              path = PurePosixPath(filename) if isinstance(filename, str) else None
              if not path or path.is_absolute() or ".." in path.parts:
                  raise ValueError(f"{task_type} requires a safe repository-relative path")
              candidate = Path(path)
              if not candidate.is_file():
                  raise ValueError(f"requested file does not exist: {filename}")
              evidence = write({"operation": task_type, "path": str(path),
                                "sha256": hashlib.sha256(candidate.read_bytes()).hexdigest()})
          elif task_type == "static_analysis":
              command = [sys.executable, "-m", "compileall", "-q", "scripts", "server"]
              completed = subprocess.run(command, capture_output=True, text=True, check=False)
              if completed.returncode:
                  raise RuntimeError(completed.stderr or "static analysis failed")
              evidence = write({"operation": task_type, "command": command, "exit_code": completed.returncode})
          elif task_type == "lint":
              command = [sys.executable, "-m", "compileall", "-q", "scripts", "server"]
              completed = subprocess.run(command, capture_output=True, text=True, check=False)
              if completed.returncode:
                  raise RuntimeError(completed.stderr or "lint failed")
              evidence = write({"operation": task_type, "command": command, "exit_code": completed.returncode})
          elif task_type == "run_tests":
              command = [sys.executable, "-m", "pytest", "-q", "tests"]
              completed = subprocess.run(command, capture_output=True, text=True, check=False)
              if completed.returncode:
                  raise RuntimeError(completed.stdout + completed.stderr)
              evidence = write({"operation": task_type, "command": command, "exit_code": completed.returncode})
          else:  # package
              command = [sys.executable, "-m", "zipfile", "-c", f"courier_package_{dispatch_id}.zip", "README.md"]
              completed = subprocess.run(command, capture_output=True, text=True, check=False)
              if completed.returncode:
                  raise RuntimeError(completed.stderr or "package failed")
              evidence = write({"operation": task_type, "package": command[-2],
                                "sha256": hashlib.sha256(Path(command[-2]).read_bytes()).hexdigest()})

          result = {
              **{field: task[field] for field in required},
              "provider": "github",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "job_id": os.environ["GITHUB_JOB"],
              "result_id": f"result-{dispatch_id}",
              "source_sha": os.environ["GITHUB_SHA"],
              "status": "SUCCESS",
              "operation": task_type,
              "artifacts": [evidence],
          }
          Path(f"result_{dispatch_id}.json").write_text(json.dumps(result, sort_keys=True) + "\n")
          PY
          set +e
          python3 "$RUNNER_TEMP/courier_task.py"
          operation_status=$?
          if [ "$operation_status" -ne 0 ]; then
            touch courier_operation_failed
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          task = json.loads(os.environ["TASK_PAYLOAD"])
          required = ("goal_id", "task_id", "attempt_id", "dispatch_id", "worker_id")
          if all(isinstance(task.get(field), str) and task[field] for field in required):
              result = {
                  **{field: task[field] for field in required},
                  "provider": "github",
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "job_id": os.environ["GITHUB_JOB"],
                  "result_id": f"result-{task['dispatch_id']}",
                  "source_sha": os.environ["GITHUB_SHA"],
                  "status": "FAILED",
                  "artifacts": [],
                  "reason": "BOUNDED_OPERATION_FAILED",
              }
              Path(f"result_{task['dispatch_id']}.json").write_text(json.dumps(result, sort_keys=True) + "\n")
          PY
          fi
      - name: Upload dispatch-bound durable result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courier-result-${{ fromJson(inputs.task_payload).dispatch_id }}
          path: |
            result_*.json
            courier_output_*.json
          if-no-files-found: error
      - name: Mark bounded operation failure
        if: always()
        run: test ! -f courier_operation_failed
