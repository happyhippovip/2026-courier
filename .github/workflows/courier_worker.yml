name: Courier Worker
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task ID"
        required: true
        type: string
      instruction:
        description: "Instruction"
        required: true
        type: string
      goal_id:
        description: "Goal ID"
        required: false
        type: string
      runner_label:
        description: "Target Runner OS/Label (windows, macos, ubuntu-latest)"
        required: true
        type: string
        default: "ubuntu-latest"
      mode:
        description: "Execution Mode (ANTIGRAVITY or NATIVE)"
        required: false
        type: string
        default: "ANTIGRAVITY"

jobs:
  execute:
    runs-on: ${{ fromJSON(github.event.inputs.runner_label) }}
    steps:
      - name: Bridge Task to Native Daemon
        shell: powershell
        run: |
          $taskId = $env:TASK_ID
          $goalId = $env:GOAL_ID
          $instruction = $env:INSTRUCTION
          $mode = $env:MODE
          $runnerOs = $env:RUNNER_OS
          
          Write-Host "Processing task: $taskId"
          Write-Host "Runner OS: $runnerOs"
          
          $taskPayload = @{
              task_id = $taskId
              instruction = $instruction
              goal_id = $goalId
              mode = $mode
          }
          $taskJson = $taskPayload | ConvertTo-Json
          
          if ($runnerOs -eq "macOS") {
              $daemonDir = "$HOME/courier/scripts/mac_worker"
              New-Item -ItemType Directory -Force -Path "$daemonDir/inbox" | Out-Null
              New-Item -ItemType Directory -Force -Path "$daemonDir/outbox" | Out-Null
              $taskJson | Set-Content -Path "$daemonDir/inbox/$taskId.json" -Encoding utf8
              
              Write-Host "Waiting for Mac daemon to finish task..."
              $outFile = "$daemonDir/outbox/${taskId}_result.json"
              while (-not (Test-Path $outFile)) {
                  Start-Sleep -Seconds 2
              }
              Copy-Item -Path $outFile -Destination "result.json"
          }
          elseif ($runnerOs -eq "Windows") {
              Write-Host "Executing on Windows Runner (Cloud or Desktop): $instruction"
              $instruction | Set-Content -Path "task_script.ps1"
              powershell.exe -File .\task_script.ps1 *>&1 | Tee-Object -FilePath "execution.log"
              $exitCode = $LASTEXITCODE
              $status = if ($exitCode -eq 0) { "SUCCESS" } else { "FAILED" }
              $res = @{
                  task_id = $taskId
                  goal_id = $goalId
                  status = $status
                  provider = "github"
                  worker_id = "GITHUB-HOSTED-WINDOWS"
                  exit_code = $exitCode
              }
              $res | ConvertTo-Json | Set-Content -Path "result.json" -Encoding utf8
          }
          else {
              Write-Host "Executing: $instruction"
              $instruction | Set-Content -Path "task_script.sh"
              bash ./task_script.sh *>&1 | Tee-Object -FilePath "execution.log"
              $exitCode = $LASTEXITCODE
              $status = if ($exitCode -eq 0) { "SUCCESS" } else { "FAILED" }
              $res = @{
                  task_id = $taskId
                  goal_id = $goalId
                  status = $status
                  provider = "github"
                  worker_id = "GITHUB-HOSTED"
                  exit_code = $exitCode
              }
              $res | ConvertTo-Json | Set-Content -Path "result.json" -Encoding utf8
          }
        env:
          TASK_ID: ${{ github.event.inputs.task_id }}
          GOAL_ID: ${{ github.event.inputs.goal_id }}
          INSTRUCTION: ${{ github.event.inputs.instruction }}
          MODE: ${{ github.event.inputs.mode }}
          RUNNER_OS: ${{ runner.os }}
      
      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courier-result-${{ github.event.inputs.task_id }}
          path: |
            result.json
            courier_canary_*.txt
            execution.log
            task_script.*
