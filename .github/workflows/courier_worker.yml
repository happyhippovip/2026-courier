name: Courier Worker
on:
  workflow_dispatch:
    inputs:
      task_payload:
        description: "Task Packet JSON"
        required: true
        type: string
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Execute Bounded Task
        id: exec
        run: |
          cat << 'PY_EOF' > run_task.py
          import os, sys, json, hashlib, uuid, subprocess
          
          payload_str = os.environ.get("TASK_PAYLOAD", "{}")
          try:
              task = json.loads(payload_str)
          except Exception as e:
              print(f"Failed to parse payload: {e}")
              sys.exit(1)
              
          task_id = task.get("task_id", "unknown")
          goal_id = task.get("goal_id", "")
          attempt_id = task.get("attempt_id", "")
          dispatch_id = task.get("dispatch_id", "")
          task_type = task.get("type", "unspecified")
          instruction = task.get("instruction", "")
          allowed_effects = task.get("allowed_effects", [])
          
          print(f"Executing task: {task_id}, type: {task_type}, dispatch: {dispatch_id}")
          
          status = "SUCCESS"
          artifacts = []
          error_msg = ""
          stdout = ""
          stderr = ""
          
          if task_type in ["bash", "native_command", "script"]:
              try:
                  res = subprocess.run(instruction, shell=True, capture_output=True, text=True)
                  stdout = res.stdout
                  stderr = res.stderr
                  if res.returncode != 0:
                      status = "FAILED"
                      error_msg = f"Command failed with exit code {res.returncode}"
              except Exception as e:
                  status = "FAILED"
                  error_msg = str(e)
          else:
              print(f"Unsupported task type: {task_type}")
              status = "FAILED"
              error_msg = "Unsupported task type"
              
          expected_artifacts = task.get("artifacts", [])
          for expected in expected_artifacts:
              art = expected.get("path") if isinstance(expected, dict) else expected
              if os.path.exists(art):
                  h = hashlib.sha256()
                  with open(art, "rb") as f:
                      h.update(f.read())
                  artifacts.append({"path": art, "sha256": h.hexdigest()})
              else:
                  print(f"Warning: Expected artifact {art} not found.")
                  
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          job_id = os.environ.get("GITHUB_JOB", "")
          sha = os.environ.get("GITHUB_SHA", "")
          
          res = {
              "goal_id": goal_id,
              "task_id": task_id,
              "attempt_id": attempt_id,
              "dispatch_id": dispatch_id,
              "worker_id": "GITHUB-ACTIONS",
              "provider": "github",
              "run_id": run_id,
              "job_id": job_id,
              "result_id": f"result-{uuid.uuid4().hex}",
              "source_sha": sha,
              "status": status,
              "artifacts": artifacts,
              "stdout": stdout,
              "stderr": stderr,
              "error": error_msg,
              "changed_property": task_type
          }
          
          with open(f"result_{dispatch_id}.json", "w") as f:
              json.dump(res, f)
          PY_EOF
          python3 run_task.py
        env:
          TASK_PAYLOAD: ${{ github.event.inputs.task_payload }}
      
      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ fromJson(github.event.inputs.task_payload).dispatch_id }}
          path: |
            result_*.json
            courier_canary_*.txt
