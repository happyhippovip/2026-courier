name: Courier Worker
on:
  workflow_dispatch:
    inputs:
      task_payload:
        description: "Task Packet JSON"
        required: true
        type: string
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Execute Bounded Task
        id: exec
        run: |
          cat << 'PY_EOF' > run_task.py
          import os, sys, json, hashlib, uuid
          
          payload_str = os.environ.get("TASK_PAYLOAD", "{}")
          try:
              task = json.loads(payload_str)
          except Exception as e:
              print(f"Failed to parse payload: {e}")
              sys.exit(1)
              
          task_id = task.get("task_id", "unknown")
          goal_id = task.get("goal_id", "")
          attempt_id = task.get("attempt_id", "")
          dispatch_id = task.get("dispatch_id", "")
          task_type = task.get("task_type", "unspecified")
          allowed_effects = task.get("allowed_effects", [])
          
          print(f"Executing task: {task_id}, type: {task_type}, dispatch: {dispatch_id}")
          
          allowed_types = ["metadata", "repo_inspect", "verify_artifact", "static_analysis", "run_tests", "lint", "report", "package", "deterministic_transform"]
          
          status = "SUCCESS"
          if task_type not in allowed_types:
              print(f"Unsupported task type: {task_type}")
              status = "FAILED_UNSUPPORTED"
              
          artifacts = []
          
          # Simulate bounded work
          if status == "SUCCESS":
              expected_artifacts = task.get("artifacts", [])
              for art in expected_artifacts:
                  # Create the expected artifact file
                  with open(art, "w") as f:
                      f.write(f"Generated by {task_type} for {task_id}\n")
                  
                  # Hash it
                  h = hashlib.sha256()
                  with open(art, "rb") as f:
                      h.update(f.read())
                  artifacts.append({"path": art, "sha256": h.hexdigest()})
                  
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          job_id = os.environ.get("GITHUB_JOB", "")
          sha = os.environ.get("GITHUB_SHA", "")
          
          res = {
              "goal_id": goal_id,
              "task_id": task_id,
              "attempt_id": attempt_id,
              "dispatch_id": dispatch_id,
              "worker_id": "GITHUB-ACTIONS",
              "provider": "github",
              "workflow_run_id": run_id,
              "job_id": job_id,
              "result_id": f"result-{uuid.uuid4().hex}",
              "source_sha": sha,
              "status": status if status != "FAILED_UNSUPPORTED" else "FAILED",
              "artifacts": artifacts,
              "changed_property": task_type
          }
          
          with open(f"result_{dispatch_id}.json", "w") as f:
              json.dump(res, f)
          PY_EOF
          python3 run_task.py
        env:
          TASK_PAYLOAD: ${{ github.event.inputs.task_payload }}
      
      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ fromJson(github.event.inputs.task_payload).dispatch_id }}
          path: |
            result_*.json
            courier_canary_*.txt
