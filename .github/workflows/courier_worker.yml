name: Courier Worker
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task ID"
        required: true
        type: string
      instruction:
        description: "Instruction"
        required: true
        type: string
      goal_id:
        description: "Goal ID"
        required: false
        type: string
      runner_label:
        description: "Target Runner OS/Label (windows, macos, ubuntu-latest)"
        required: true
        type: string
        default: "ubuntu-latest"
      mode:
        description: "Execution Mode (ANTIGRAVITY or NATIVE)"
        required: false
        type: string
        default: "ANTIGRAVITY"

jobs:
  execute:
    runs-on: ${{ fromJSON(github.event.inputs.runner_label) }}
    steps:
      - name: Bridge Task to Native Daemon
        shell: python
        run: |
          import os, sys, json, time, shutil
          
          task_id = os.environ.get("TASK_ID", "")
          goal_id = os.environ.get("GOAL_ID", "")
          instruction = os.environ.get("INSTRUCTION", "")
          mode = os.environ.get("MODE", "ANTIGRAVITY")
          runner_os = os.environ.get("RUNNER_OS", "")
          
          print(f"Processing task: {task_id}")
          print(f"Runner OS: {runner_os}")
          
          task_payload = {
              "task_id": task_id,
              "instruction": instruction,
              "goal_id": goal_id,
              "mode": mode
          }
          
          if runner_os == "macOS":
              daemon_dir = os.path.expanduser("~/courier/scripts/mac_worker")
              os.makedirs(f"{daemon_dir}/inbox", exist_ok=True)
              os.makedirs(f"{daemon_dir}/outbox", exist_ok=True)
              with open(f"{daemon_dir}/inbox/{task_id}.json", "w") as f:
                  json.dump(task_payload, f)
                  
              print("Waiting for Mac daemon to finish task...")
              out_file = f"{daemon_dir}/outbox/{task_id}_result.json"
              while not os.path.exists(out_file):
                  time.sleep(2)
              shutil.copy(out_file, "result.json")
              
          elif runner_os == "Windows":
              daemon_dir = "C:/Users/lol/2026-workspace/courier/scripts/windows_worker"
              os.makedirs(f"{daemon_dir}/inbox", exist_ok=True)
              os.makedirs(f"{daemon_dir}/outbox", exist_ok=True)
              with open(f"{daemon_dir}/inbox/{task_id}.json", "w") as f:
                  json.dump(task_payload, f)
                  
              print("Waiting for Windows daemon to finish task...")
              out_file = f"{daemon_dir}/outbox/{task_id}_result.json"
              while not os.path.exists(out_file):
                  time.sleep(2)
              shutil.copy(out_file, "result.json")
              
          else:
              # Ubuntu cloud mode
              print(f"Executing: {instruction}")
              with open("task_script.sh", "w") as f:
                  f.write(instruction)
              os.chmod("task_script.sh", 0o755)
              exit_code = os.system("./task_script.sh")
              res = {
                  "task_id": task_id,
                  "goal_id": goal_id,
                  "status": "SUCCESS" if exit_code == 0 else "FAILED",
                  "provider": "github",
                  "worker_id": "GITHUB-HOSTED",
                  "exit_code": exit_code
              }
              with open("result.json", "w") as f:
                  json.dump(res, f)
        env:
          TASK_ID: ${{ github.event.inputs.task_id }}
          GOAL_ID: ${{ github.event.inputs.goal_id }}
          INSTRUCTION: ${{ github.event.inputs.instruction }}
          MODE: ${{ github.event.inputs.mode }}
          RUNNER_OS: ${{ runner.os }}
      
      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courier-result-${{ github.event.inputs.task_id }}
          path: |
            result.json
            courier_canary_*.txt
