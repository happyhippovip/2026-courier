name: Revenue V1 Baseline

on:
  push:
    branches:
      - courier/heavy-process-supervisor

jobs:
  worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Courier
        uses: actions/checkout@v4
        
      - name: Write Task Payload
        run: |
          cat << 'TASKEOF' > task.json
          {
            "schema_version": "1.0",
            "goal_id": "rev-v1-proof",
            "task_id": "task-002",
            "attempt_id": "attempt-001",
            "idempotency_key": "rev-v1-idem-0002",
            "capability": "github-actions-safety-baseline-v1",
            "scope": "public-repo-inspection",
            "target_owner": "happyhippovip",
            "target_repo": "2026-courier",
            "target_sha": "5a9d421f476139a36a6650825c4f7874117426ef",
            "customer_reference": "CUST-002",
            "price_currency": "USD 0.00",
            "delivery_destination": "none",
            "budget": {"max_files": 100, "max_bytes": 1048576},
            "result_contract": "revenue-v1-report",
            "proposal_mode": "PR_ONLY"
          }
          TASKEOF
          
      - name: Execute Revenue V1 Worker
        run: |
          python3 scripts/revenue_v1_safety_baseline.py worker task.json work_dir > result.json
          
      - name: Upload Worker Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worker-artifacts
          path: |
            task.json
            work_dir/report.json
            work_dir/report.md
            result.json

  verifier:
    needs: worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Courier
        uses: actions/checkout@v4
        
      - name: Download Worker Artifacts
        uses: actions/download-artifact@v4
        with:
          name: worker-artifacts
          
      - name: Execute Independent Verifier
        run: |
          python3 scripts/revenue_v1_safety_baseline.py verify task.json work_dir result.json > verified.json
          
      - name: Upload Verified Result
        uses: actions/upload-artifact@v4
        with:
          name: verified-artifacts
          path: |
            verified.json

  handoff:
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Courier
        uses: actions/checkout@v4
        
      - name: Download Verified Result
        uses: actions/download-artifact@v4
        with:
          name: verified-artifacts
          
      - name: Phase-8 PR Proposal Handoff
        run: |
          if [ ! -f "scripts/phase8_workforce.py" ]; then
            echo "REAL WALL: scripts/phase8_workforce.py is required for Phase-8 PR proposal but exists only in unmerged PR #8."
            echo "Stopping here rather than simulating handoff."
            exit 1
          fi
