name: Revenue V1 Baseline

on:
  workflow_dispatch:
    inputs:
      courier_ref:
        description: 'Immutable Courier commit containing the TaskPacket'
        required: true
        type: string
      task_packet_path:
        description: 'Repository-relative durable TaskPacket path'
        required: true
        type: string

jobs:
  worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Courier
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.courier_ref }}
        
      - name: Read admitted TaskPacket
        env:
          COURIER_REF: ${{ inputs.courier_ref }}
          TASK_PACKET_PATH: ${{ inputs.task_packet_path }}
        run: |
          if [[ ! "$COURIER_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "courier_ref must be an immutable commit SHA"
            exit 1
          fi
          if [[ ! "$TASK_PACKET_PATH" =~ ^revenue_v1/inbox/[a-z0-9-]+\.json$ ]]; then
            echo "Invalid task_packet_path"
            exit 1
          fi
          git show "${COURIER_REF}:${TASK_PACKET_PATH}" > task.json
          jq -e '
            .schema_version == "1.0" and
            (.goal_id | type == "string" and length > 0) and
            (.task_id | type == "string" and test("^task-[a-z0-9-]+$")) and
            .attempt_id == "attempt-001" and
            (.idempotency_key | type == "string" and length > 0) and
            .capability == "github-actions-safety-baseline-v1" and
            .execution_lane == "github-actions-revenue-v1" and
            .scope == "public-repo-inspection" and
            (.target_owner | test("^[a-zA-Z0-9_-]+$")) and
            (.target_repo | test("^[a-zA-Z0-9_.-]+$")) and
            (.target_sha | test("^[0-9a-fA-F]{40}$")) and
            (.customer_reference | type == "string" and length > 0) and
            (.price_currency | test("^EUR [0-9]+\\.[0-9]{2}$")) and
            (.delivery_destination | type == "string" and length > 0) and
            .proposal_mode == "PR_ONLY"
          ' task.json > /dev/null
          
      - name: Execute Revenue V1 Worker
        run: |
          python3 scripts/revenue_v1_safety_baseline.py worker task.json work_dir > result.json
          
      - name: Upload Worker Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worker-artifacts
          path: |
            task.json
            work_dir/report.json
            work_dir/report.md
            result.json

  verifier:
    needs: worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Courier
        uses: actions/checkout@v4
        
      - name: Download Worker Artifacts
        uses: actions/download-artifact@v4
        with:
          name: worker-artifacts
          
      - name: Execute Independent Verifier
        run: |
          python3 scripts/revenue_v1_safety_baseline.py verify task.json work_dir result.json > verified.json
          
      - name: Upload Verified Result
        uses: actions/upload-artifact@v4
        with:
          name: verified-artifacts
          path: |
            verified.json

  handoff:
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Courier
        uses: actions/checkout@v4
        
      - name: Download Worker Artifacts
        uses: actions/download-artifact@v4
        with:
          name: worker-artifacts
          
      - name: Download Verified Result
        uses: actions/download-artifact@v4
        with:
          name: verified-artifacts
          
      - name: Create PR and Handoff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROPOSAL_HEAD="revenue/result-proposal-${GITHUB_RUN_ID}"
          
          # 1. Setup git and branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -b "$PROPOSAL_HEAD" origin/main
          
          # 2. Add durable result
          mkdir -p revenue_v1/results
          TASK_ID=$(jq -r .task_id task.json)
          ATTEMPT_ID=$(jq -r .attempt_id task.json)
          RESULT_PATH="revenue_v1/results/${TASK_ID}-${ATTEMPT_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          cp verified.json "$RESULT_PATH"
          
          git add "$RESULT_PATH"
          git commit -m "Propose Revenue V1 Result for ${TASK_ID}"
          git push origin "$PROPOSAL_HEAD"
          
          RESULT_COMMIT=$(git rev-parse HEAD)
          
          # 3. Create PR
          PR_URL=$(gh pr create --title "Revenue V1: $TASK_ID" --body "Automated result handoff." --base main --head "$PROPOSAL_HEAD")
          PR_NUMBER=$(echo "$PR_URL" | awk -F'/' '{print $NF}')
          
          # 4. Construct handoff JSON
          cat << HANDOFFEOF > handoff.json
          {
            "task_id": "$TASK_ID",
            "attempt_id": "$ATTEMPT_ID",
            "result_path": "$RESULT_PATH",
            "verifier_id": "revenue-v1-independent-verifier",
            "result_commit": "$RESULT_COMMIT",
            "proposal_branch": "$PROPOSAL_HEAD",
            "proposal_pr": "$PR_URL",
            "human_merge_required": true
          }
          HANDOFFEOF
          
          # 5. Run Reconciler
          python3 scripts/revenue_v1_safety_baseline.py reconcile task.json work_dir verified.json handoff.json "$PR_NUMBER" "$PROPOSAL_HEAD" "main" > reconciliation.json
          
          # 6. Output for artifacts
          cat reconciliation.json
          
      - name: Upload Reconciliation
        uses: actions/upload-artifact@v4
        with:
          name: handoff-artifacts
          path: |
            handoff.json
            reconciliation.json
