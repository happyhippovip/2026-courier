name: Deploy Courier Website to GitHub Pages

on:
  # Manual trigger only for the public deploy.
  workflow_dispatch:
    inputs:
      contact_email:
        description: 'Optional approved contact email. Leave empty to keep GitHub Issues only.'
        default: ''
        required: false
        type: string
  # Fast build check on this preview branch only. It does not deploy.
  push:
    branches:
      - cursor/website-release-truth-9db2
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate-website:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and check the preview
        run: python3 website/check_site.py

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: website/public
          if-no-files-found: error

  build-and-deploy:
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Website
        env:
          COURIER_CONTACT_EMAIL: ${{ inputs.contact_email }}
        run: |
          chmod +x website/build_site.sh
          cd website
          ./build_site.sh

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
