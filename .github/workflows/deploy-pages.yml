name: Deploy Courier Website to GitHub Pages

on:
  # Manual trigger only - prevents unauthorized irreversible public deployment
  workflow_dispatch:
    inputs:
      contact_email:
        description: 'Approved Public Contact Email (e.g. pilot@yourdomain.com)'
        default: 'hobbiejanssen@gmx.net'
        required: true
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Website
        env:
          COURIER_CONTACT_EMAIL: ${{ inputs.contact_email }}
        run: |
          chmod +x website/build_site.sh
          cd website
          ./build_site.sh
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
