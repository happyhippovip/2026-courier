name: Courier Motor

on:
  # Runtime state must never be committed to git. The 5-minute cron and the
  # commit/push of server/state/central_state.json are disabled; the motor can
  # still be run manually for diagnostics, but it no longer persists state.
  workflow_dispatch:

# One motor at a time; queued runs wait instead of dispatching twice.
concurrency:
  group: courier-motor
  cancel-in-progress: false

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      has_work: ${{ steps.check.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/courier_motor_precheck.py
            server/state/central_state.json

      - id: check
        name: Check for claimable GitHub work (read-only, stdlib only)
        run: python3 scripts/courier_motor_precheck.py

  motor:
    needs: precheck
    if: github.event_name == 'workflow_dispatch' || needs.precheck.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install flask requests

      - name: Run Courier Motor
        env:
          COURIER_API_KEY: ${{ secrets.COURIER_API_KEY }}
          COURIER_VERIFIER_API_KEY: ${{ secrets.COURIER_VERIFIER_API_KEY }}
          COURIER_SERVER: "http://127.0.0.1:8080"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKER_LOCAL_WAIT_SECONDS: "60"
        run: |
          export PYTHONPATH="$PWD:$PYTHONPATH"
          # The server below is a throwaway process on this runner. Without
          # repository secrets, fall back to per-run random keys (never committed).
          for var in COURIER_API_KEY COURIER_VERIFIER_API_KEY; do
            if [ -z "${!var}" ]; then
              if command -v python3 >/dev/null 2>&1; then
                _k=$(python3 -c 'import secrets; print(secrets.token_hex(24))')
              elif command -v openssl >/dev/null 2>&1; then
                _k=$(openssl rand -hex 24)
              else
                echo "[Motor] ERROR: no key generator (python3/openssl) available" >&2
                exit 1
              fi
              [ -n "$_k" ] || { echo "[Motor] ERROR: ephemeral key generation produced an empty key" >&2; exit 1; }
              export "$var=$_k"
              unset _k
              echo "[Motor] $var secret not set; using an ephemeral per-run key."
            fi
            echo "::add-mask::${!var}"
          done
          echo "[Motor] Starting internal state server..."
          python3 server/app.py &
          SERVER_PID=$!
          sleep 3

          echo "[Motor] Starting verifier..."
          python3 scripts/courier_verifier.py &
          VERIFIER_PID=$!
          sleep 1

          echo "[Motor] Starting dispatcher for 1 tick..."
          timeout 5 python3 scripts/courier_github_dispatcher.py || true
          
          echo "[Motor] Waiting for adapters to finish (up to 70s)..."
          for i in {1..70}; do
            if ! pgrep -f "github_worker_adapter.py" > /dev/null; then
              break
            fi
            sleep 1
          done
          
          # Give verifier a chance to verify any results just posted
          sleep 5

          echo "[Motor] Stopping background processes..."
          kill $VERIFIER_PID || true
          kill $SERVER_PID || true
          echo "[Motor] Run complete. State is not persisted to git (runtime state stays out of the repository)."
