name: Courier v1 CI

# Verification authority for the v1 trunk (integration/v1) and lane branches.
# Runs on lane pushes, on every push to integration/v1 itself (direct pushes and
# merges must carry exact-SHA evidence) and on PRs into integration/v1.
on:
  push:
    branches: ["integration/v1"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: ["integration/v1"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned dependencies
        run: python -m pip install -e ".[test]"

      - name: Run test suite through the regression gate
        shell: bash
        env:
          PYTHONPATH: .github/ci
          COURIER_CI_OUTCOMES: ${{ runner.temp }}/outcomes.json
        run: |
          # Ephemeral, distinct authorities for the legacy server tests; never persisted.
          export COURIER_API_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          export COURIER_VERIFIER_API_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          set +e
          # A module that cannot be imported on this platform is recorded as a failure of
          # <module>::<collection> instead of aborting the whole session.
          python -m pytest -q -p outcomes_plugin --timeout=180 --continue-on-collection-errors tests
          echo "pytest exit status: $?"
          set -e
          python .github/ci/check_regressions.py \
            --outcomes "$COURIER_CI_OUTCOMES" \
            --known .github/ci/known_failures.json \
            --platform "${{ runner.os }}"

      - name: Tests leave tracked files unchanged
        if: always()
        shell: bash
        # Blocking on Linux; reported only on Windows until a clean Windows run is evidenced.
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: git diff --stat --exit-code

      - name: Local safety ratchet (no new kill-by-name or wildcard binds)
        if: always()
        shell: bash
        run: python scripts/check_local_safety.py . --baseline acceptance/local_safety_baseline.json

      - name: Upload per-test outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outcomes-${{ matrix.os }}
          path: ${{ runner.temp }}/outcomes.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if tests wrote into the working tree
        shell: bash
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "Tests modified or created non-ignored files in the repository:"
            echo "$status"
            exit 1
          fi

  desktop-js:
    name: desktop JS tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run tests/desktop (when present)
        shell: bash
        run: |
          if [ -d tests/desktop ]; then
            node --test tests/desktop/*.test.mjs
          else
            echo "tests/desktop not present yet; nothing to run."
          fi

  windows-build:
    # The pytest job installs only the test extra, so the CourierHub.exe build
    # test always skips there, and a skipped launcher build looks the same as a
    # green one. This job installs PyInstaller, parses every PowerShell script,
    # runs a live install -> start -> stop-by-PID -> uninstall, and fails if any
    # of these Windows tests is skipped. It then installs pinned Inno Setup
    # 6.7.0, compiles CourierSetup-v1.exe, and runs rollback, silent install,
    # upgrade, and uninstall on this fresh runner.
    name: windows build (launcher, hub exe, PowerShell, setup)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned dependencies with the build extra
        run: python -m pip install -e ".[test,build]"

      - name: Parse every tracked PowerShell script
        shell: pwsh
        run: |
          $failed = 0
          foreach ($file in (git ls-files '*.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed++
              foreach ($e in $errors) { Write-Host "::error file=$file,line=$($e.Extent.StartLineNumber)::$($e.Message)" }
            } else {
              Write-Host "OK $file"
            }
          }
          if ($failed -gt 0) { exit 1 }

      - name: Build the launcher and hub exe, live install/stop/uninstall (no skips allowed)
        shell: bash
        env:
          COURIER_LIVE_INSTALL_TEST: "1"
        run: |
          python -m pytest -q -rA --timeout=900 \
            --junitxml="$RUNNER_TEMP/windows-build.xml" \
            tests/test_windows_launcher_guard.py \
            "tests/test_windows_exe_build.py::test_windows_exe_builds_and_answers" \
            tests/test_windows_live_install_stop.py \
            tests/test_windows_live_agy_fake.py
          python - "$RUNNER_TEMP/windows-build.xml" <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          cases = list(root.iter("testcase"))
          skipped = [c.get("name") for c in cases if c.find("skipped") is not None]
          print(f"cases={len(cases)} skipped={len(skipped)}")
          if not cases or skipped:
              sys.exit(f"Windows build tests must run, not skip: {skipped}")
          EOF

      - name: Build the launcher release binary from source
        shell: pwsh
        run: |
          & scripts\windows_worker\launcher\build_launcher.ps1
          $hash = (Get-FileHash scripts\windows_worker\Courier.exe -Algorithm SHA256).Hash
          "Courier.exe SHA256 $hash (built from $env:GITHUB_SHA)" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Upload the launcher built from this commit
        uses: actions/upload-artifact@v4
        with:
          name: courier-launcher-exe
          path: scripts/windows_worker/Courier.exe
          if-no-files-found: error
          retention-days: 30

      - name: Compile CourierSetup-v1.exe and verify silent install
        shell: pwsh
        env:
          COURIER_INSTALL_INNO: "1"
        run: |
          & scripts\windows_worker\build_installer.ps1 -VerifyInstall
          $hash = (Get-FileHash scripts\windows_worker\CourierSetup-v1.exe -Algorithm SHA256).Hash
          "CourierSetup-v1.exe SHA256 $hash (built from $env:GITHUB_SHA)" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Upload the setup built from this commit
        uses: actions/upload-artifact@v4
        with:
          name: courier-setup-exe
          path: scripts/windows_worker/CourierSetup-v1.exe
          if-no-files-found: error
          retention-days: 30

  golden-skip-ratchet:
    # The 11 Golden tests skip by design until the v1 modules land; the
    # regression gate tolerates skips silently. This job pins the expected
    # skip shape instead: any change in either direction fails until the
    # pin in .github/ci/check_golden_skips.py is deliberately updated by
    # the merge that lands the modules. Golden skip behavior is
    # platform-independent, so one ubuntu run is enough.
    name: golden skip ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned dependencies
        run: python -m pip install -e ".[test]"

      - name: Pin golden skip shape
        shell: bash
        run: python .github/ci/check_golden_skips.py
