name: Phase 8 bounded workforce canary

on:
  workflow_dispatch:
    inputs:
      task_path:
        description: Repository-relative Phase 8 task JSON path
        required: true
        type: string

concurrency:
  group: phase8-workforce-${{ github.ref }}-${{ inputs.task_path }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-task:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      task_path: ${{ steps.validate.outputs.task_path }}
      task_id: ${{ steps.validate.outputs.task_id }}
      attempt_id: ${{ steps.validate.outputs.attempt_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: validate
        env:
          TASK_PATH: ${{ inputs.task_path }}
        run: |
          set -eu
          case "$TASK_PATH" in phase8/tasks/*.json) ;; *) exit 1 ;; esac
          test -f "$TASK_PATH"
          python3 scripts/phase8_workforce.py validate --task "$TASK_PATH"
          printf 'task_path=%s\n' "$TASK_PATH" >> "$GITHUB_OUTPUT"
          python3 - "$TASK_PATH" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          task = json.load(open(sys.argv[1], encoding="utf-8"))
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write(f"task_id={task['task_id']}\n")
              output.write(f"attempt_id={task['attempt_id']}\n")
          PY

  codex-worker:
    needs: validate-task
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      worker_result: ${{ steps.worker.outputs.worker_result }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: worker
        run: |
          set -eu
          result="$(python3 scripts/phase8_workforce.py worker --task "${{ needs.validate-task.outputs.task_path }}" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}")"
          printf 'worker_result=%s\n' "$result" >> "$GITHUB_OUTPUT"

  verify-result:
    needs: [validate-task, codex-worker]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result_path: ${{ steps.verify.outputs.result_path }}
      verifier_id: phase8-independent-verifier-v1
      verifier_result: ${{ steps.verify.outputs.verifier_result }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: verify
        env:
          WORKER_RESULT: ${{ needs.codex-worker.outputs.worker_result }}
        run: |
          set -eu
          candidate="$(mktemp)"
          printf '%s' "$WORKER_RESULT" > "$candidate"
          result_path="phase8/results/${{ needs.validate-task.outputs.task_id }}-${{ needs.validate-task.outputs.attempt_id }}-${{ github.run_id }}-${{ github.run_attempt }}.json"
          python3 scripts/phase8_workforce.py verify --task "${{ needs.validate-task.outputs.task_path }}" --candidate "$candidate" --existing-dir phase8/results --output "$result_path" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}"
          printf 'result_path=%s\n' "$result_path" >> "$GITHUB_OUTPUT"
          python3 - "$result_path" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write("verifier_result=" + json.dumps(result, sort_keys=True, separators=(",", ":")) + "\n")
          PY

  propose-result:
    needs: [validate-task, verify-result]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PROPOSAL_BRANCH: phase8/result-proposal-${{ github.run_id }}-${{ github.run_attempt }}
      TASK_ID: ${{ needs.validate-task.outputs.task_id }}
      ATTEMPT_ID: ${{ needs.validate-task.outputs.attempt_id }}
      RESULT_PATH: ${{ needs.verify-result.outputs.result_path }}
      VERIFIER_ID: ${{ needs.verify-result.outputs.verifier_id }}
      TASK_PATH: ${{ needs.validate-task.outputs.task_path }}
      VERIFIED_RESULT: ${{ needs.verify-result.outputs.verifier_result }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Create reviewable durable result proposal
        run: |
          set -eu
          test -n "$TASK_ID"; test -n "$ATTEMPT_ID"; test -n "$RESULT_PATH"; test -n "$VERIFIER_ID"; test -n "$VERIFIED_RESULT"
          candidate="$(mktemp)"
          printf '%s' "$VERIFIED_RESULT" > "$candidate"
          python3 scripts/phase8_workforce.py validate-result --task "$TASK_PATH" --candidate "$candidate" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}"
          mkdir -p "$(dirname "$RESULT_PATH")"
          cp "$candidate" "$RESULT_PATH"
          gh auth setup-git
          git switch -c "$PROPOSAL_BRANCH"
          git add "$RESULT_PATH"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Propose Phase 8 canary result"
          git push origin "HEAD:$PROPOSAL_BRANCH"
          result_commit="$(git rev-parse HEAD)"
          proposal_url="$(gh pr create --base main --head "$PROPOSAL_BRANCH" --title "Propose Phase 8 result for $TASK_ID" --body "Task: $TASK_ID

          Attempt: $ATTEMPT_ID

          Result: $RESULT_PATH

          Verifier: $VERIFIER_ID

          A human must review and merge this proposal."
          )"
          handoff_path="phase8/handoffs/${TASK_ID}-${ATTEMPT_ID}-${{ github.run_id }}-${{ github.run_attempt }}.json"
          python3 - "$handoff_path" "$TASK_ID" "$ATTEMPT_ID" "$RESULT_PATH" "$VERIFIER_ID" "$result_commit" "$PROPOSAL_BRANCH" "$proposal_url" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              "task_id": sys.argv[2], "attempt_id": sys.argv[3],
              "result_path": sys.argv[4], "verifier_id": sys.argv[5],
              "result_commit": sys.argv[6], "proposal_branch": sys.argv[7],
              "proposal_pr": sys.argv[8], "human_merge_required": True,
          }, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
          git add "$handoff_path"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Record Phase 8 proposal handoff"
          git push origin "HEAD:$PROPOSAL_BRANCH"
