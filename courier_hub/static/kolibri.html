<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kolibri</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/hub.css">
<link rel="stylesheet" href="/kolibri.css">
<style>
  #beams-section { max-width: 900px; margin: 12px auto; }
  #beams { width: 100%; height: 320px; display: block; border-radius: 12px; background: #05030c; }
  #insight-hud { max-width: 900px; margin: 12px auto; }
  #insight-hud .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
  #insight-hud .fact { background: rgba(14,11,28,.85); border: 1px solid rgba(199,125,255,.25);
    border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  #insight-hud .fact b { display: block; font-size: 12px; color: #9d94c7; text-transform: uppercase; letter-spacing: .08em; }
</style>
<script type="module" src="/kolibri.js"></script>
</head>
<body>
<canvas id="biosphere" aria-hidden="true"></canvas>
<canvas id="particles" aria-hidden="true"></canvas>
<a class="skip" href="#view">Skip to view</a>
<header class="top">
  <h1>Kolibri</h1>
  <p id="status" role="status" aria-live="polite">Loading…</p>
  <button type="button" id="refresh" title="Refresh (R)">Refresh</button>
  <a class="link" href="/mission-chip" style="color: #10b981; font-weight: 600;">Mission Chip</a>
  <a class="link" href="/">Hub</a>
</header>
<main id="view" tabindex="-1">
  <noscript>
    <p>UNKNOWN / nicht erreichbar</p>
    <p class="meta">source browser script</p>
    <p class="meta">timestamp UNKNOWN / nicht erreichbar</p>
  </noscript>
</main>
<section id="beams-section" aria-label="Orb-Verbindungen">
  <canvas id="beams" width="800" height="320" role="img" aria-label="Schwarze Orbs mit Verbindungsstrahlen"></canvas>
</section>
<section id="insight-hud" aria-label="Einsichten"></section>
</body>
</html>
