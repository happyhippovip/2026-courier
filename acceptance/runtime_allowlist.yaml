{
  "_format": "JSON syntax on purpose: valid YAML, readable without PyYAML.",
  "_status": "DRAFT. Default deny: a file ships only if an allow pattern names it and no deny pattern matches. The Windows packaging owner confirms or extends `allow`; `deny` lists what must never reach a customer machine.",
  "_patterns": "`**` crosses folders, `*` and `?` stay inside one path segment. Matching ignores case and treats backslashes as slashes.",
  "allow": [
    "Courier.exe",
    "install.ps1",
    "uninstall.ps1",
    "manifest.json",
    "LICENSE*",
    "python/**",
    "adapters/**",
    "courier_core/**",
    "courier_worker/**",
    "courier_hub/**"
  ],
  "deny": [
    {"pattern": "scripts/**", "class": "fleet-tooling"},
    {"pattern": "tools/**", "class": "fleet-tooling"},
    {"pattern": "ops/**", "class": "fleet-tooling"},
    {"pattern": "deploy/**", "class": "fleet-tooling"},
    {"pattern": "mcp/**", "class": "fleet-tooling"},
    {"pattern": ".github/**", "class": "fleet-tooling"},
    {"pattern": ".agents/**", "class": "fleet-tooling"},
    {"pattern": "tests/**", "class": "test-material"},
    {"pattern": "fixtures/**", "class": "test-material"},
    {"pattern": "acceptance/**", "class": "test-material"},
    {"pattern": "memory/**", "class": "internal-strategy"},
    {"pattern": "docs/**", "class": "internal-strategy"},
    {"pattern": "handoffs/**", "class": "internal-strategy"},
    {"pattern": "claims/**", "class": "internal-strategy"},
    {"pattern": "reports/**", "class": "internal-strategy"},
    {"pattern": "*.md", "class": "internal-strategy"},
    {"pattern": "runtime/**", "class": "runtime-state"},
    {"pattern": "logs/**", "class": "runtime-state"},
    {"pattern": "events/**", "class": "runtime-state"},
    {"pattern": "intakes/**", "class": "runtime-state"},
    {"pattern": "tasks/**", "class": "runtime-state"},
    {"pattern": "config/**", "class": "internal-config"},
    {"pattern": "**/slots.json", "class": "internal-config"},
    {"pattern": "**/agent_handoff_ledger.json", "class": "internal-config"},
    {"pattern": "**/.env", "class": "secret"},
    {"pattern": "**/.env.*", "class": "secret"},
    {"pattern": "**/*.token", "class": "secret"},
    {"pattern": "**/auth.json", "class": "secret"},
    {"pattern": "**/credentials*.json", "class": "secret"},
    {"pattern": "**/.git/**", "class": "repository"},
    {"pattern": ".git/**", "class": "repository"}
  ]
}
