global_contracts:
  power_governor:
    user_ceiling_values: [AUTO, 1, 2, 3, 5, 10, 15, 20]
    max_tasks_values: [10, 20, 50, 100]
    safe_actual_concurrency: >-
      min(user_ceiling, independent_ready_tasks, qualified_workers,
      scope_safe_capacity, configured_resource_capacity, provider_capacity)
    modes:
      ECO: {ceiling: 1, intent: lowest resource use}
      QUICK: {ceiling: 2, intent: responsive bounded work}
      TURBO: {ceiling: 3, intent: parallel independent work}
      BOOST: {ceiling: 5, intent: larger verified batches}
      HYPER: {ceiling: 10, intent: high-capacity local or deterministic work}
      ULTRA: {ceiling: 15, intent: explicitly provisioned capacity}
      CANNON: {ceiling: 20, intent: maximum configured safe capacity}
      AUTO: {ceiling: AUTO, intent: continuously recomputed safe minimum}
    invariants:
      - a mode is a ceiling, never a dispatch promise
      - zero READY work means zero model workers
      - provider or resource pressure scales down deterministically
      - no automatic spending or quota bypass
  task_board_states: [READY, RUNNING, WAITING, DONE, BLOCKED, BRAUCHT_MICH]
  max_tasks:
    meaning: planning envelope, independent from concurrency
    overflow: reject_or_split_before_persistence
  common_do_not_touch:
    - server/app.py
    - scripts/agent_handoff_ledger.py
    - scripts/courier_continue.py
    - active Google Ledger/Guard/Motor files
    - active Muse cockpit files

packages:
