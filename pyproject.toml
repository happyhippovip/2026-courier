[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "courier-runtime"
version = "0.1.0"
description = "The durable runtime for work that outlives the AI session."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Courier Open Source Community", email = "hello@courier-agent.local"}
]
dependencies = [
    "Flask>=2.0.0",
    "requests>=2.25.0",
    "psutil>=5.8.0",
    "keyring>=23.0.0"
]

[project.urls]
Homepage = "https://github.com/your-org/courier"
Repository = "https://github.com/your-org/courier.git"

[tool.setuptools.packages.find]
include = ["server", "server.*", "providers", "providers.*", "scripts", "scripts.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
